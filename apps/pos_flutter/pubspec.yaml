name: light_winter_retailos
description: Light Winter Technologies retail POS client for Android, iOS, SUNMI, and Windows.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  printing: ^5.14.3
  pdf: ^3.12.0
  path_provider: ^2.1.5
  http: ^1.6.0
  url_launcher: ^6.3.2
  file_picker: ^10.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/light_winter_logo.png
